<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="UTF-8">
<title>Job Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f5f7f8;
    --surface: #ffffff;
    --surface-alt: #eef1f4;
    --surface-sunken: #e7ebee;
    --ink: #1b2430;
    --ink-muted: #5b6572;
    --ink-faint: #8992a0;
    --border: #dce1e7;
    --border-strong: #c3cad2;
    --accent: #2b6e63;
    --accent-ink: #ffffff;
    --accent-soft: #dceee9;
    --accent-soft-ink: #1e5148;
    --warn: #93691f;
    --warn-soft: #f5ead2;
    --danger: #a3453f;
    --danger-soft: #f6dfdd;
    --success: #2f7a52;
    --focus: #2b6e63;
    --shadow: 0 12px 32px -12px rgba(27, 36, 48, 0.28);
    --shadow-sm: 0 1px 2px rgba(27, 36, 48, 0.08);
    --radius: 10px;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c;
      --surface: #1a2029;
      --surface-alt: #212834;
      --surface-sunken: #0e1218;
      --ink: #e9edf2;
      --ink-muted: #a2acb9;
      --ink-faint: #6b7484;
      --border: #2c3441;
      --border-strong: #3a4453;
      --accent: #5aab9b;
      --accent-ink: #0d1a17;
      --accent-soft: #1e3833;
      --accent-soft-ink: #8fd0c0;
      --warn: #d3ac5e;
      --warn-soft: #3a3120;
      --danger: #e18c85;
      --danger-soft: #3c2422;
      --success: #6fbb8e;
      --focus: #5aab9b;
      --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.6);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #12161c;
    --surface: #1a2029;
    --surface-alt: #212834;
    --surface-sunken: #0e1218;
    --ink: #e9edf2;
    --ink-muted: #a2acb9;
    --ink-faint: #6b7484;
    --border: #2c3441;
    --border-strong: #3a4453;
    --accent: #5aab9b;
    --accent-ink: #0d1a17;
    --accent-soft: #1e3833;
    --accent-soft-ink: #8fd0c0;
    --warn: #d3ac5e;
    --warn-soft: #3a3120;
    --danger: #e18c85;
    --danger-soft: #3c2422;
    --success: #6fbb8e;
    --focus: #5aab9b;
    --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 28px 80px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .topbar h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .topbar .sub {
    color: var(--ink-muted);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    min-width: 76px;
    box-shadow: var(--shadow-sm);
  }

  .stat .n {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 1.15rem;
    line-height: 1.2;
  }

  .stat .l {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border-strong);
    margin-bottom: 0;
  }

  .tab {
    appearance: none;
    border: 1px solid var(--border-strong);
    border-bottom: none;
    background: var(--surface-alt);
    color: var(--ink-muted);
    font: inherit;
    font-weight: 600;
    font-size: 0.86rem;
    padding: 9px 18px 8px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    position: relative;
    top: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tab .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 6px;
    color: var(--ink-faint);
  }

  .tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    border-bottom: 1px solid var(--surface);
  }

  .tab[aria-selected="true"] .count {
    color: var(--ink-muted);
  }

  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Table shell ---------- */
  .sheet {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 0 8px 8px 8px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }

  .search-field {
    position: relative;
    display: flex;
    align-items: center;
    width: min(280px, 100%);
  }

  .search-icon {
    position: absolute;
    left: 9px;
    width: 15px; height: 15px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  .search-field input {
    width: 100%;
    font: inherit;
    font-size: 0.82rem;
    padding: 7px 28px 7px 30px;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  .search-field input:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent);
  }
  .search-field input::placeholder { color: var(--ink-faint); }

  .search-field #search-clear {
    position: absolute;
    right: 6px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.72rem;
    width: 18px; height: 18px;
    border-radius: 4px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-field #search-clear:hover { background: var(--surface-sunken); color: var(--ink); }
  .search-field.has-value #search-clear { display: flex; }

  .sort-hint {
    font-size: 0.72rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .sheet-scroll {
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 980px;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--surface-alt);
    text-align: left;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border-strong);
    border-right: 1px solid var(--border);
    white-space: nowrap;
    z-index: 1;
  }

  thead th:last-child { border-right: none; }

  thead th.sortable {
    cursor: pointer;
    user-select: none;
  }
  thead th.sortable:hover { color: var(--ink); background: var(--surface-sunken); }
  thead th.sortable .arrow {
    display: inline-block;
    margin-left: 4px;
    opacity: 0;
    color: var(--accent);
  }
  thead th.sortable.active .arrow { opacity: 1; }
  thead th.sortable.active { color: var(--ink); }
  thead th:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  tbody td {
    padding: 0;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody td:last-child { border-right: none; }

  tbody tr:hover { background: var(--surface-alt); }
  tbody tr:hover td { background: var(--surface-alt); }

  tbody input, tbody select {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.82rem;
    padding: 8px 10px;
    border-radius: 4px;
  }

  tbody input[type="number"] { font-family: "IBM Plex Mono", monospace; }
  tbody input[type="date"] { font-family: "IBM Plex Mono", monospace; font-size: 0.76rem; }

  tbody input:hover, tbody select:hover { background: var(--surface-sunken); }
  tbody input:focus, tbody select:focus {
    outline: none;
    border-color: var(--focus);
    background: var(--surface);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 25%, transparent);
  }

  .col-position input, .col-company input { font-weight: 600; }

  .cell-num { text-align: right; }
  .cell-num input { text-align: right; }

  input.low-rating, .field input.low-rating {
    color: var(--danger);
    font-weight: 600;
  }

  .chk-cell { text-align: center; }
  .chk-cell input[type="checkbox"] {
    width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill-remote { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .pill-hybrid { background: var(--warn-soft); color: var(--warn); }
  .pill-onsite { background: var(--surface-sunken); color: var(--ink-muted); }

  select.loc-select {
    -webkit-appearance: none; appearance: none;
    cursor: pointer;
  }

  .row-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    white-space: nowrap;
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    border-radius: 6px;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.85rem;
    flex: none;
  }
  .icon-btn:hover { background: var(--surface-alt); color: var(--ink); border-color: var(--border-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  .move-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .move-btn:hover { background: var(--accent-soft); color: var(--accent-soft-ink); border-color: var(--accent); }
  .move-btn.back:hover { background: var(--surface-alt); color: var(--ink); border-color: var(--border-strong); }

  .add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: var(--surface);
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .empty {
    padding: 56px 24px;
    text-align: center;
    color: var(--ink-muted);
  }
  .empty h2 { color: var(--ink); font-size: 1.05rem; margin: 0 0 6px; }
  .empty p { margin: 0 0 16px; font-size: 0.88rem; }

  /* ---------- Drawer ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15, 19, 24, 0.42);
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(560px, 100vw);
    background: var(--surface);
    border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateX(100%);
    transition: transform 0.22s cubic-bezier(.32,.72,.35,1);
    z-index: 41;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  @media (prefers-reduced-motion: reduce) {
    .drawer, .scrim { transition: none; }
  }

  .drawer-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex: none;
  }

  .drawer-head .titles input {
    font-size: 1.15rem;
    font-weight: 700;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    width: 100%;
    padding: 2px 4px;
    border-radius: 4px;
    margin-bottom: 2px;
  }
  .drawer-head .titles input.company {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--ink-muted);
  }
  .drawer-head .titles input:hover { background: var(--surface-sunken); }
  .drawer-head .titles input:focus {
    outline: none; border-color: var(--focus); background: var(--surface-alt);
  }

  .drawer-body {
    padding: 18px 22px 40px;
    overflow-y: auto;
    flex: 1;
  }

  .section {
    margin-bottom: 26px;
  }

  .section-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--ink-muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.span-2 { grid-column: 1 / -1; }

  .field label {
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-weight: 500;
  }

  .field input, .field select, .field textarea {
    font: inherit;
    font-size: 0.86rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 8px 10px;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent);
  }
  .field textarea { resize: vertical; min-height: 64px; font-family: inherit; line-height: 1.45; }
  .field.checkline { flex-direction: row; align-items: center; gap: 8px; }
  .field.checkline input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .field.checkline label { font-size: 0.86rem; color: var(--ink); }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    background: var(--surface-alt);
    position: relative;
  }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0; }

  .card .rm {
    position: absolute; top: 8px; right: 8px;
  }

  .entry-card { display: flex; flex-direction: column; gap: 8px; }
  .entry-head { display: flex; align-items: center; gap: 10px; }
  .entry-head input[type="date"] {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.82rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .entry-card textarea {
    font: inherit; font-size: 0.85rem; line-height: 1.45;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 8px; min-height: 56px; resize: vertical;
  }
  .entry-card textarea:focus, .entry-head input:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent);
  }

  .ghost-btn {
    border: 1px dashed var(--border-strong);
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 8px;
    border-radius: 7px;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  .ghost-btn:hover { background: var(--surface-alt); color: var(--accent); border-color: var(--accent); }

  .drawer-foot {
    border-top: 1px solid var(--border);
    padding: 12px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: none;
    background: var(--surface);
  }

  .stage-badge {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .stage-jobs { background: var(--surface-sunken); color: var(--ink-muted); }
  .stage-applied { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .stage-interviewing { background: var(--warn-soft); color: var(--warn); }
  .stage-rejected { background: var(--danger-soft); color: var(--danger); }

  .sync-status {
    font-size: 0.72rem;
    color: var(--ink-faint);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sync-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }
  .sync-status.on .dot { background: var(--success); }
  .sync-status.off .dot { background: var(--warn); }

  .export-link {
    border: none;
    background: none;
    color: var(--ink-faint);
    font: inherit;
    font-size: 0.72rem;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
    margin-left: 2px;
  }
  .export-link:hover { color: var(--accent); }
  .export-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .bookmarklet-hint { color: var(--ink-faint); font-size: 0.72rem; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  ::selection { background: var(--accent-soft); }
</style>

<div class="app">
  <header class="topbar">
    <div>
      <h1>Job Tracker</h1>
      <div class="sub">Your search, one sheet at a time. <span class="sync-status" id="sync-status"><span class="dot"></span><span id="sync-status-text">Checking sync…</span></span> <button type="button" id="export-btn" class="export-link">Export backup</button> · <a href="#" id="bookmarklet-link" class="export-link">+ Add-job bookmarklet</a> <span class="bookmarklet-hint">(drag to your bookmarks bar)</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Job tracker stages">
    <button class="tab" role="tab" data-stage="jobs" aria-selected="true">Jobs <span class="count" id="count-jobs">0</span></button>
    <button class="tab" role="tab" data-stage="applied" aria-selected="false">Applied <span class="count" id="count-applied">0</span></button>
    <button class="tab" role="tab" data-stage="interviewing" aria-selected="false">Interviewing <span class="count" id="count-interviewing">0</span></button>
    <button class="tab" role="tab" data-stage="rejected" aria-selected="false">Rejected <span class="count" id="count-rejected">0</span></button>
  </nav>

  <div class="sheet">
    <div class="toolbar">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M18 18L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="search-input" placeholder="Search by company name">
        <button type="button" id="search-clear" aria-label="Clear search">✕</button>
      </div>
      <span class="sort-hint" id="sort-hint"></span>
    </div>
    <div class="sheet-scroll">
      <table id="table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="add-row">
      <button class="btn btn-primary" id="add-btn" type="button">+ Add job</button>
      <button class="btn" id="paste-btn" type="button">+ Paste from bookmarklet</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="titles">
      <input type="text" id="d-position" class="position" placeholder="Job position" aria-label="Job position">
      <input type="text" id="d-company" class="company" placeholder="Company name" aria-label="Company name">
    </div>
    <button class="icon-btn" id="d-close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body">

    <div class="section">
      <p class="section-title">Role details</p>
      <div class="field-grid">
        <div class="field"><label for="d-date">Date added</label><input type="date" id="d-date"></div>
        <div class="field"><label for="d-location">Location</label>
          <select id="d-location"><option value="Remote">Remote</option><option value="Hybrid">Hybrid</option><option value="On-site">On-site</option></select>
        </div>
        <div class="field"><label for="d-reviewPercent">Glassdoor rating (out of 5)</label><input type="number" id="d-reviewPercent" min="0" max="5" step="0.1"></div>
        <div class="field"><label for="d-reviewCount">Glassdoor # of reviews</label><input type="number" id="d-reviewCount" min="0" step="1"></div>
        <div class="field"><label for="d-postedSalary">Posted salary</label><input type="text" id="d-postedSalary" placeholder="e.g. $110k – $130k"></div>
        <div class="field"><label for="d-salaryAsk">Salary ask</label><input type="text" id="d-salaryAsk" placeholder="e.g. $125k"></div>
        <div class="field"><label for="d-pto">PTO</label><input type="text" id="d-pto" placeholder="e.g. 15 days + holidays"></div>
        <div class="field"><label for="d-medical">Medical</label><input type="text" id="d-medical" placeholder="e.g. Blue Cross PPO, 80% covered"></div>
        <div class="field span-2"><label for="d-companyUrl">Company URL</label><input type="text" id="d-companyUrl" placeholder="https://"></div>
        <div class="field span-2"><label for="d-postingUrl">Job posting link</label><input type="text" id="d-postingUrl" placeholder="https://"></div>
        <div class="field span-2"><label for="d-values">Company values</label><textarea id="d-values" placeholder="Culture, mission, values that stood out"></textarea></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Application</p>
      <div class="field-grid">
        <div class="field"><label for="d-dateApplied">Date applied</label><input type="date" id="d-dateApplied"></div>
        <div class="field"><label for="d-whereApplied">Where applied</label><input type="text" id="d-whereApplied" placeholder="e.g. LinkedIn, company site, referral"></div>
        <div class="field span-2 checkline"><input type="checkbox" id="d-interviewing"><label for="d-interviewing">Interviewing</label></div>
        <div class="field span-2"><label for="d-dateRejected">Date rejected</label><input type="date" id="d-dateRejected"></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Contacts</p>
      <div class="card-list" id="contacts-list"></div>
      <button class="ghost-btn" id="add-contact" type="button" style="margin-top:8px;">+ Add contact</button>
    </div>

    <div class="section">
      <p class="section-title">Interviews</p>
      <div class="card-list" id="interviews-list"></div>
      <button class="ghost-btn" id="add-interview" type="button" style="margin-top:8px;">+ Add interview</button>
    </div>

    <div class="section">
      <p class="section-title">Follow-ups</p>
      <div class="card-list" id="followups-list"></div>
      <button class="ghost-btn" id="add-followup" type="button" style="margin-top:8px;">+ Add follow-up</button>
    </div>

    <div class="section">
      <p class="section-title">General notes</p>
      <textarea id="d-notes" style="width:100%; min-height:100px; font:inherit; font-size:0.86rem; line-height:1.5; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:7px; padding:10px;" placeholder="Anything else worth remembering about this one"></textarea>
    </div>
  </div>
  <div class="drawer-foot">
    <span class="stage-badge" id="d-stage-badge">Jobs</span>
    <button class="icon-btn danger" id="d-delete" type="button" aria-label="Delete record" title="Delete record">🗑</button>
  </div>
</aside>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "jobTrackerData.v1";
  var state = { activeStage: "jobs", activeId: null, jobs: [], search: "", sortKey: null, sortDir: "asc" };

  function uid() { return "j" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.jobs)) return parsed.jobs;
      }
    } catch (e) { /* ignore corrupted storage */ }
    return [];
  }

  function localSave() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ jobs: state.jobs }));
    } catch (e) { /* storage unavailable; edits stay in-memory for this session */ }
  }

  // ---------- Cloud sync (db capability) ----------
  // localStorage is per-browser only, so a record made here is invisible from a
  // different browser or device. When the "db" capability is granted, every write
  // also goes to the artifact's shared document store, keyed by job id, so the
  // same tracker is reachable from anywhere the viewer is signed in.
  var dbApi = null;
  var jobsCol = null;
  var writeTimers = {};
  var syncStatusEl = document.getElementById("sync-status");
  var syncStatusText = document.getElementById("sync-status-text");

  function setSyncStatus(mode, text) {
    if (!syncStatusEl) return;
    syncStatusEl.className = "sync-status" + (mode ? " " + mode : "");
    syncStatusText.textContent = text;
  }

  function cloneJob(job) {
    return JSON.parse(JSON.stringify(job));
  }

  function normalizeJob(data) {
    var j = blankJob();
    Object.keys(j).forEach(function (k) {
      if (data && data[k] !== undefined) j[k] = data[k];
    });
    if (data && data.id) j.id = data.id;
    return j;
  }

  function save(job, immediate) {
    localSave();
    if (!jobsCol || !job) return;
    var id = job.id;
    if (writeTimers[id]) { clearTimeout(writeTimers[id]); delete writeTimers[id]; }
    var body = cloneJob(job);
    var doWrite = function () {
      delete writeTimers[id];
      jobsCol.doc(id).set(body).catch(function () {
        setSyncStatus("off", "Sync paused — changes are saved on this device");
      });
    };
    if (immediate) doWrite();
    else writeTimers[id] = setTimeout(doWrite, 500);
  }

  function deleteFromDb(id) {
    if (!jobsCol) return;
    if (writeTimers[id]) { clearTimeout(writeTimers[id]); delete writeTimers[id]; }
    jobsCol.doc(id).delete().catch(function () {
      setSyncStatus("off", "Sync paused — changes are saved on this device");
    });
  }

  async function initCloudSync() {
    if (!window.claude || typeof window.claude.use !== "function") {
      setSyncStatus("off", "Saved on this device only");
      return;
    }
    try {
      dbApi = await window.claude.use("db");
    } catch (e) {
      dbApi = null;
    }
    if (!dbApi) {
      setSyncStatus("off", "Saved on this device only");
      return;
    }
    jobsCol = dbApi.collection("jobs");
    try {
      var snap = await jobsCol.orderBy("createdAt").get();
      if (!snap.empty) {
        state.jobs = snap.docs.map(function (d) { return normalizeJob(d.data()); });
        localSave();
        renderTable();
      } else if (state.jobs.length) {
        state.jobs.forEach(function (j) { save(j, true); });
      }
    } catch (e) { /* keep whatever loaded from localStorage */ }

    jobsCol.orderBy("createdAt").onSnapshot(function (snap) {
      if (state.activeId) return; // don't clobber an in-progress edit in the drawer
      var jobs = snap.docs.map(function (d) { return normalizeJob(d.data()); });
      state.jobs = jobs;
      localSave();
      renderTable();
    }, function () {
      setSyncStatus("off", "Sync paused — changes are saved on this device");
    });

    setSyncStatus("on", "Synced to your account");
  }

  // ---------- Export backup ----------
  // Extra insurance beyond cloud sync: a manual, viewer-initiated download of everything,
  // as a plain JSON file the viewer keeps for themselves.
  var hasClaudeRuntime = !!(window.claude && typeof window.claude.use === "function");
  var downloadsApi = null;
  var exportBtn = document.getElementById("export-btn");

  async function initExport() {
    if (!hasClaudeRuntime) return; // plain browser tab: the blob fallback below just works
    try { downloadsApi = await window.claude.use("downloads"); } catch (e) { downloadsApi = null; }
    if (!downloadsApi) exportBtn.style.display = "none";
  }

  async function exportBackup() {
    var payload = JSON.stringify({ exportedAt: new Date().toISOString(), jobs: state.jobs }, null, 2);
    var filename = "job-tracker-backup-" + todayStr() + ".json";
    var originalLabel = exportBtn.textContent;

    if (downloadsApi) {
      try {
        await downloadsApi.save({ filename: filename, data: payload });
        exportBtn.textContent = "Backup saved";
        setTimeout(function () { exportBtn.textContent = originalLabel; }, 2000);
      } catch (e) {
        if (!e || e.code !== "declined") alert("Couldn't save the backup just now — try again in a moment.");
      }
      return;
    }
    if (hasClaudeRuntime) return; // capability unavailable; button is hidden, this is just a safeguard

    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener("click", exportBackup);

  // ---------- "Add from this page" bookmarklet ----------
  // A draggable javascript: link. On a job posting page it reads Schema.org JobPosting
  // structured data when present (most ATSes emit it), falls back to guessing from the
  // page title, copies a plain-text summary to the clipboard as a backup, and opens this
  // tracker with the guess pre-filled so the viewer can confirm before it's saved.
  // Address of YOUR published copy of this page. Only the bookmarklet uses it (to open the tracker
  // after capturing a posting). Replace it with the link to your own artifact before using the bookmarklet.
  var TRACKER_URL = "https://claude.ai/artifact/YOUR-ARTIFACT-ID";
  var BOOKMARKLET_SRC = [
    "(function(){",
    "function meta(n){var e=document.querySelector('meta[property=\"'+n+'\"]')||document.querySelector('meta[name=\"'+n+'\"]');return e?e.content:'';}",
    "function findJobPosting(){",
    "var scripts=document.querySelectorAll('script[type=\"application/ld+json\"]');",
    "for(var i=0;i<scripts.length;i++){",
    "try{",
    "var data=JSON.parse(scripts[i].textContent);",
    "var items=Array.isArray(data)?data:(data['@graph']||[data]);",
    "for(var j=0;j<items.length;j++){",
    "var it=items[j];",
    "if(it&&(it['@type']==='JobPosting'||(Array.isArray(it['@type'])&&it['@type'].indexOf('JobPosting')>-1)))return it;",
    "}",
    "}catch(e){}",
    "}",
    "return null;",
    "}",
    "var jp=findJobPosting();",
    "var position='',company='',workMode='';",
    "if(jp){",
    "position=jp.title||'';",
    "company=(jp.hiringOrganization&&jp.hiringOrganization.name)||'';",
    "var loc=jp.jobLocationType||'';",
    "if(/telecommute|remote/i.test(loc))workMode='Remote';",
    "}",
    "if(!position||!company){",
    "var t=meta('og:title')||document.title||'';",
    "var seps=[' at ',' - ',' | ',' — ',' :: '];",
    "for(var s=0;s<seps.length;s++){",
    "if(t.indexOf(seps[s])>-1){",
    "var parts=t.split(seps[s]);",
    "if(!position)position=parts[0].trim();",
    "if(!company&&parts[1])company=parts[1].trim();",
    "break;",
    "}",
    "}",
    "if(!position)position=t;",
    "}",
    "var params=new URLSearchParams();",
    "params.set('add','1');",
    "params.set('position',position);",
    "params.set('company',company);",
    "params.set('postingUrl',window.location.href);",
    "if(workMode)params.set('location',workMode);",
    "if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText('Position: '+position+'\\nCompany: '+company+'\\nPosting: '+window.location.href).catch(function(){});}",
    "window.open('" + TRACKER_URL + "?'+params.toString(),'_blank');",
    "})();"
  ].join("");
  document.getElementById("bookmarklet-link").href = "javascript:" + BOOKMARKLET_SRC;
  document.getElementById("bookmarklet-link").addEventListener("click", function (e) { e.preventDefault(); });

  // Creates a job from captured {position, company, postingUrl, location} and opens it
  // for review. Shared by the URL-param path (handleBookmarkletAdd) and the clipboard
  // fallback (pasteFromBookmarklet) — claude.ai doesn't reliably pass the bookmarklet's
  // URL parameters through, so the clipboard path is the one that actually works today.
  function addJobFromCapture(fields) {
    var job = blankJob();
    job.date = todayStr();
    job.position = fields.position || "";
    job.company = fields.company || "";
    job.postingUrl = fields.postingUrl || "";
    if (fields.location === "Remote" || fields.location === "Hybrid" || fields.location === "On-site") {
      job.location = fields.location;
    }
    state.jobs.push(job);
    save(job, true);
    state.activeStage = "jobs";
    tabs.forEach(function (o) { o.setAttribute("aria-selected", o.getAttribute("data-stage") === "jobs" ? "true" : "false"); });
    renderTable();
    openDrawer(job.id);
    return job;
  }

  function handleBookmarkletAdd() {
    var params = new URLSearchParams(window.location.search);
    if (params.get("add") !== "1") return;
    addJobFromCapture({
      position: params.get("position"),
      company: params.get("company"),
      postingUrl: params.get("postingUrl"),
      location: params.get("location")
    });
    history.replaceState(null, "", window.location.pathname);
  }

  // Parses the "Position: ...\nCompany: ...\nPosting: ..." text the bookmarklet copies
  // to the clipboard. Tolerates the lines appearing in any order or with extra lines
  // around them (in case the clipboard held something else appended after copying).
  function parseBookmarkletClipboard(text) {
    var fields = { position: "", company: "", postingUrl: "" };
    (text || "").split("\n").forEach(function (line) {
      var m = line.match(/^\s*(Position|Company|Posting)\s*:\s*(.*)$/i);
      if (!m) return;
      var key = m[1].toLowerCase();
      var val = m[2].trim();
      if (key === "position") fields.position = val;
      else if (key === "company") fields.company = val;
      else if (key === "posting") fields.postingUrl = val;
    });
    return fields;
  }

  document.getElementById("paste-btn").addEventListener("click", async function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      alert("This browser won't let the page read your clipboard. Paste into a new job's fields manually instead.");
      return;
    }
    var text;
    try {
      text = await navigator.clipboard.readText();
    } catch (e) {
      alert("Couldn't read the clipboard — your browser may need permission. Try clicking this button again, or paste the fields in manually.");
      return;
    }
    var fields = parseBookmarkletClipboard(text);
    if (!fields.position && !fields.company && !fields.postingUrl) {
      alert("Nothing that looks like a bookmarklet capture is on your clipboard right now. Click the \"+ Add-job bookmarklet\" on the job posting's page first, then try this again.");
      return;
    }
    addJobFromCapture(fields);
  });

  function blankJob() {
    return {
      id: uid(), stage: "jobs", createdAt: Date.now(),
      date: "", position: "", company: "",
      reviewPercent: "", reviewCount: "", postedSalary: "", salaryAsk: "",
      location: "Remote", pto: "", medical: "",
      dateApplied: "", whereApplied: "", interviewing: false,
      dateRejected: "",
      companyUrl: "", postingUrl: "", values: "", notes: "",
      contacts: [], interviews: [], followups: []
    };
  }

  state.jobs = load();

  // ---------- Column definitions per stage ----------
  var BASE_COLS = [
    { key: "date", label: "Date", type: "date", w: "112px" },
    { key: "position", label: "Job position", type: "text", cls: "col-position", w: "160px" },
    { key: "company", label: "Company", type: "text", cls: "col-company", w: "150px" },
    { key: "reviewPercent", label: "Glassdoor rating", type: "number", num: true, min: 0, max: 5, step: 0.1, w: "116px" },
    { key: "reviewCount", label: "Glassdoor #", type: "number", num: true, w: "100px" },
    { key: "postedSalary", label: "Posted salary", type: "text", w: "128px" },
    { key: "salaryAsk", label: "Salary ask", type: "text", w: "120px" },
    { key: "location", label: "Location", type: "location", w: "118px" },
    { key: "pto", label: "PTO", type: "text", w: "120px" },
    { key: "medical", label: "Medical", type: "text", w: "140px" }
  ];
  // Shared so entering a value moves the record forward from any tab that shows it
  // (Jobs, Applied, Interviewing, Rejected) — see applyDateAppliedAutoMove / applyInterviewingToggle.
  var COL_DATE_APPLIED = { key: "dateApplied", label: "Date applied", type: "date", w: "116px" };
  var COL_WHERE_APPLIED = { key: "whereApplied", label: "Where applied", type: "text", w: "140px" };
  var COL_INTERVIEWING = { key: "interviewing", label: "Interviewing", type: "checkbox", w: "96px" };
  var COL_DATE_REJECTED = { key: "dateRejected", label: "Date rejected", type: "date", w: "116px" };

  var COLS_JOBS = BASE_COLS.concat([COL_DATE_APPLIED, COL_INTERVIEWING]);
  var COLS_APPLIED = BASE_COLS.concat([COL_DATE_APPLIED, COL_WHERE_APPLIED, COL_INTERVIEWING]);
  var COLS_REJECTED = COLS_APPLIED.concat([COL_DATE_REJECTED]);
  var STAGE_COLS = { jobs: COLS_JOBS, applied: COLS_APPLIED, interviewing: COLS_APPLIED, rejected: COLS_REJECTED };
  var STAGE_LABEL = { jobs: "Jobs", applied: "Applied", interviewing: "Interviewing", rejected: "Rejected" };

  // ---------- Tabs ----------
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      state.activeStage = t.getAttribute("data-stage");
      tabs.forEach(function (o) { o.setAttribute("aria-selected", o === t ? "true" : "false"); });
      state.sortKey = null;
      renderTable();
    });
  });

  // ---------- Search ----------
  var searchInput = document.getElementById("search-input");
  var searchField = document.querySelector(".search-field");
  document.getElementById("search-clear").addEventListener("click", function () {
    state.search = "";
    searchInput.value = "";
    searchField.classList.remove("has-value");
    searchInput.focus();
    renderTable();
  });
  searchInput.addEventListener("input", function () {
    state.search = searchInput.value;
    searchField.classList.toggle("has-value", !!state.search);
    renderTable();
  });

  // ---------- Sortable headers ----------
  document.getElementById("thead-row").addEventListener("click", function (e) {
    var th = e.target.closest("th.sortable");
    if (!th) return;
    var key = th.getAttribute("data-key");
    if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    else { state.sortKey = key; state.sortDir = "asc"; }
    renderTable();
  });
  document.getElementById("thead-row").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var th = e.target.closest("th.sortable");
    if (!th) return;
    e.preventDefault();
    th.click();
  });

  document.getElementById("add-btn").addEventListener("click", function () {
    var job = blankJob();
    job.stage = state.activeStage;
    if (state.activeStage === "applied" && !job.dateApplied) job.dateApplied = todayStr();
    if (state.activeStage === "interviewing") {
      job.dateApplied = job.dateApplied || todayStr();
      job.interviewing = true;
    }
    if (state.activeStage === "rejected" && !job.dateRejected) job.dateRejected = todayStr();
    state.jobs.push(job);
    save(job, true);
    renderTable();
    openDrawer(job.id);
  });

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function fmt(v) { return v === undefined || v === null ? "" : v; }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- Table rendering ----------
  function renderStats() {
    var jobs = state.jobs.filter(function (j) { return j.stage === "jobs"; }).length;
    var applied = state.jobs.filter(function (j) { return j.stage === "applied"; }).length;
    var interviewing = state.jobs.filter(function (j) { return j.stage === "interviewing"; }).length;
    var rejected = state.jobs.filter(function (j) { return j.stage === "rejected"; }).length;
    document.getElementById("stats").innerHTML = [
      ["Tracking", jobs + applied + interviewing + rejected],
      ["Applied", applied],
      ["Interviewing", interviewing],
      ["Rejected", rejected]
    ].map(function (s) {
      return '<div class="stat"><span class="n">' + s[1] + '</span><span class="l">' + s[0] + '</span></div>';
    }).join("");
    document.getElementById("count-jobs").textContent = jobs;
    document.getElementById("count-applied").textContent = applied;
    document.getElementById("count-interviewing").textContent = interviewing;
    document.getElementById("count-rejected").textContent = rejected;
  }

  function cellHtml(job, col) {
    var v = fmt(job[col.key]);
    if (col.type === "checkbox") {
      return '<div class="chk-cell"><input type="checkbox" data-id="' + job.id + '" data-field="' + col.key + '" ' + (job[col.key] ? "checked" : "") + '></div>';
    }
    if (col.type === "location") {
      var opts = ["Remote", "Hybrid", "On-site"].map(function (o) {
        return '<option value="' + o + '"' + (v === o ? " selected" : "") + '>' + o + "</option>";
      }).join("");
      return '<select class="loc-select" data-id="' + job.id + '" data-field="location">' + opts + "</select>";
    }
    var type = col.type === "number" ? "number" : (col.type === "date" ? "date" : "text");
    var esc = String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    var extra = col.num ? ' inputmode="decimal"' : "";
    if (col.min !== undefined) extra += ' min="' + col.min + '"';
    if (col.max !== undefined) extra += ' max="' + col.max + '"';
    if (col.step !== undefined) extra += ' step="' + col.step + '"';
    var cls = col.key === "reviewPercent" && isLowRating(v) ? ' class="low-rating"' : "";
    return '<input type="' + type + '" value="' + esc + '" data-id="' + job.id + '" data-field="' + col.key + '"' + cls + extra + '>';
  }

  function isLowRating(v) {
    var n = parseFloat(v);
    return v !== "" && !isNaN(n) && n < 3;
  }

  function compareJobs(a, b, col, dir) {
    var av = a[col.key], bv = b[col.key];
    var cmp;
    if (col.type === "number") {
      var an = av === "" || av === null || av === undefined || isNaN(av) ? null : parseFloat(av);
      var bn = bv === "" || bv === null || bv === undefined || isNaN(bv) ? null : parseFloat(bv);
      if (an === null && bn === null) cmp = 0;
      else if (an === null) cmp = 1;
      else if (bn === null) cmp = -1;
      else cmp = an - bn;
    } else if (col.type === "checkbox") {
      cmp = (bv ? 1 : 0) - (av ? 1 : 0);
    } else {
      var as = (av || "").toString().toLowerCase();
      var bs = (bv || "").toString().toLowerCase();
      if (as === "" && bs === "") cmp = 0;
      else if (as === "") cmp = 1;
      else if (bs === "") cmp = -1;
      else cmp = as < bs ? -1 : as > bs ? 1 : 0;
    }
    return dir === "desc" ? -cmp : cmp;
  }

  function renderTable() {
    renderStats();
    var stage = state.activeStage;
    var cols = STAGE_COLS[stage];
    var rows = state.jobs.filter(function (j) { return j.stage === stage; });

    var searching = !!state.search.trim();
    if (searching) {
      var q = state.search.trim().toLowerCase();
      rows = rows.filter(function (j) { return (j.company || "").toLowerCase().indexOf(q) !== -1; });
    }

    var sortCol = state.sortKey ? cols.filter(function (c) { return c.key === state.sortKey; })[0] : null;
    if (sortCol) {
      rows = rows.slice().sort(function (a, b) { return compareJobs(a, b, sortCol, state.sortDir); });
    }

    var thead = document.getElementById("thead-row");
    thead.innerHTML = cols.map(function (c) {
      var active = sortCol && sortCol.key === c.key;
      var arrow = active ? (state.sortDir === "asc" ? "▲" : "▼") : "▲";
      return '<th class="sortable' + (active ? " active" : "") + '" data-key="' + c.key +
        '" tabindex="0" style="width:' + c.w + '">' + c.label + '<span class="arrow">' + arrow + "</span></th>";
    }).join("") + '<th style="width:180px">Actions</th>';

    var hintEl = document.getElementById("sort-hint");
    hintEl.textContent = sortCol ? ("Sorted by " + sortCol.label + " " + (state.sortDir === "asc" ? "↑" : "↓")) : "";

    var tbody = document.getElementById("tbody");
    if (rows.length === 0) {
      var heading = searching ? "No companies match “" + escapeHtml(state.search.trim()) + "”" : "No records in " + STAGE_LABEL[stage] + " yet";
      var body = searching ? "Try a different spelling, or clear the search to see everything in " + STAGE_LABEL[stage] + "." :
        (stage === "jobs" ? "Add a role you're considering to start tracking it." : "Move a record here from another tab, or add one directly.");
      tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '"><div class="empty">' +
        "<h2>" + heading + "</h2>" +
        "<p>" + body + "</p>" +
        (searching ? "" : '<button class="btn btn-primary" type="button" onclick="document.getElementById(\'add-btn\').click()">+ Add job</button>') +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (job) {
      var cells = cols.map(function (c) {
        var cls = [c.cls, c.num ? "cell-num" : ""].filter(Boolean).join(" ");
        return '<td class="' + cls + '">' + cellHtml(job, c) + "</td>";
      }).join("");

      var moveBtns = "";
      if (stage === "jobs") {
        moveBtns = '<button class="move-btn" data-action="to-applied" data-id="' + job.id + '">Applied →</button>';
      } else if (stage === "applied") {
        moveBtns = '<button class="move-btn back" data-action="to-jobs" data-id="' + job.id + '">← Jobs</button>' +
          '<button class="move-btn" data-action="to-rejected" data-id="' + job.id + '">Rejected →</button>';
      } else if (stage === "interviewing") {
        moveBtns = '<button class="move-btn back" data-action="to-applied" data-id="' + job.id + '">← Applied</button>' +
          '<button class="move-btn" data-action="to-rejected" data-id="' + job.id + '">Rejected →</button>';
      } else if (stage === "rejected") {
        moveBtns = '<button class="move-btn back" data-action="to-applied" data-id="' + job.id + '">← Applied</button>';
      }

      return '<tr>' + cells +
        '<td><div class="row-actions">' +
        '<button class="icon-btn" data-action="view" data-id="' + job.id + '" title="Open record" aria-label="Open record">⤢</button>' +
        moveBtns +
        '<button class="icon-btn danger" data-action="delete" data-id="' + job.id + '" title="Delete" aria-label="Delete">🗑</button>' +
        "</div></td></tr>";
    }).join("");
  }

  function findJob(id) {
    for (var i = 0; i < state.jobs.length; i++) if (state.jobs[i].id === id) return state.jobs[i];
    return null;
  }

  // Checking "Interviewing" while a row is in Applied moves it to the Interviewing tab;
  // unchecking it while in Interviewing moves it back to Applied. Shared by the main
  // sheet and the drawer.
  // Checking "Interviewing" moves the record to the Interviewing tab from wherever it
  // currently is (Jobs, Applied, or Rejected); unchecking it moves it back to Applied.
  function applyInterviewingToggle(job, checked) {
    job.interviewing = checked;
    var moved = false;
    if (checked && job.stage !== "interviewing") {
      job.stage = "interviewing";
      if (!job.dateApplied) job.dateApplied = todayStr();
      moved = true;
    } else if (!checked && job.stage === "interviewing") {
      job.stage = "applied";
      moved = true;
    }
    return moved;
  }

  // Filling in "Date applied" while still in Jobs moves the record to Applied.
  function applyDateAppliedAutoMove(job) {
    if (job.dateApplied && job.stage === "jobs") {
      job.stage = "applied";
      return true;
    }
    return false;
  }

  // Delegated input/change handling for inline editing (avoids full re-render per keystroke)
  document.getElementById("tbody").addEventListener("input", function (e) {
    var el = e.target;
    var id = el.getAttribute("data-id"), field = el.getAttribute("data-field");
    if (!id || !field) return;
    var job = findJob(id);
    if (!job) return;
    if (el.type === "checkbox") job[field] = el.checked;
    else job[field] = el.value;
    if (field === "reviewPercent") el.classList.toggle("low-rating", isLowRating(el.value));
    save(job);
  });

  document.getElementById("tbody").addEventListener("change", function (e) {
    var el = e.target;
    var id = el.getAttribute("data-id"), field = el.getAttribute("data-field");
    var job = id ? findJob(id) : null;
    if (job && el.tagName === "SELECT") {
      job[field] = el.value;
      save(job);
    } else if (job && el.type === "checkbox" && field === "interviewing") {
      var moved = applyInterviewingToggle(job, el.checked);
      save(job, true);
      if (moved) { renderTable(); return; }
    } else if (job && field === "dateApplied") {
      var movedDate = applyDateAppliedAutoMove(job);
      save(job, true);
      if (movedDate) { renderTable(); return; }
    }
    renderStats();
  });

  document.getElementById("tbody").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var job = findJob(id);
    if (!job) return;
    var action = btn.getAttribute("data-action");
    if (action === "view") { openDrawer(id); return; }
    if (action === "delete") {
      if (confirm("Delete this record? This can't be undone.")) {
        state.jobs = state.jobs.filter(function (j) { return j.id !== id; });
        localSave();
        deleteFromDb(id);
        renderTable();
      }
      return;
    }
    if (action === "to-applied") {
      job.stage = "applied";
      job.interviewing = false;
      if (!job.dateApplied) job.dateApplied = todayStr();
    } else if (action === "to-rejected") {
      job.stage = "rejected";
      if (!job.dateRejected) job.dateRejected = todayStr();
    } else if (action === "to-jobs") {
      job.stage = "jobs";
      job.interviewing = false;
    }
    save(job, true);
    renderTable();
  });

  // ---------- Drawer ----------
  var drawer = document.getElementById("drawer");
  var scrim = document.getElementById("scrim");

  var SIMPLE_FIELDS = ["date", "location", "reviewPercent", "reviewCount", "postedSalary", "salaryAsk",
    "pto", "medical", "companyUrl", "postingUrl", "values", "dateApplied", "whereApplied", "dateRejected", "notes"];

  function updateStageBadge(job) {
    var badge = document.getElementById("d-stage-badge");
    badge.textContent = STAGE_LABEL[job.stage];
    badge.className = "stage-badge stage-" + job.stage;
  }

  function openDrawer(id) {
    var job = findJob(id);
    if (!job) return;
    state.activeId = id;

    document.getElementById("d-position").value = job.position || "";
    document.getElementById("d-company").value = job.company || "";
    SIMPLE_FIELDS.forEach(function (f) {
      var el = document.getElementById("d-" + f);
      if (el) el.value = job[f] || "";
    });
    document.getElementById("d-interviewing").checked = !!job.interviewing;
    document.getElementById("d-reviewPercent").classList.toggle("low-rating", isLowRating(job.reviewPercent));

    updateStageBadge(job);

    renderContacts(job);
    renderEntries(job, "interviews", "interviews-list");
    renderEntries(job, "followups", "followups-list");

    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    scrim.classList.add("open");
    document.getElementById("d-position").focus();
  }

  function closeDrawer() {
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    scrim.classList.remove("open");
    state.activeId = null;
    renderTable();
  }

  document.getElementById("d-close").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
  });

  document.getElementById("d-delete").addEventListener("click", function () {
    if (!state.activeId) return;
    if (confirm("Delete this record? This can't be undone.")) {
      var id = state.activeId;
      state.jobs = state.jobs.filter(function (j) { return j.id !== id; });
      localSave();
      deleteFromDb(id);
      closeDrawer();
    }
  });

  document.getElementById("drawer").addEventListener("input", function (e) {
    var el = e.target;
    if (!state.activeId) return;
    var job = findJob(state.activeId);
    if (!job) return;
    if (el.id === "d-position") { job.position = el.value; save(job); return; }
    if (el.id === "d-company") { job.company = el.value; save(job); return; }
    if (el.id === "d-interviewing") {
      var moved = applyInterviewingToggle(job, el.checked);
      updateStageBadge(job);
      save(job, true);
      if (moved) renderTable();
      return;
    }
    var m = el.id.match(/^d-(.+)$/);
    if (m && SIMPLE_FIELDS.indexOf(m[1]) !== -1) {
      job[m[1]] = el.value;
      if (m[1] === "reviewPercent") el.classList.toggle("low-rating", isLowRating(el.value));
      save(job);
    }
  });
  document.getElementById("drawer").addEventListener("blur", function (e) {
    var job = state.activeId && findJob(state.activeId);
    if (job && (e.target.id === "d-position" || e.target.id === "d-company")) save(job, true);
  }, true);
  document.getElementById("drawer").addEventListener("change", function (e) {
    var job = state.activeId && findJob(state.activeId);
    if (!job) return;
    if (e.target.id === "d-dateApplied") {
      var moved = applyDateAppliedAutoMove(job);
      updateStageBadge(job);
      save(job, true);
      if (moved) renderTable();
      return;
    }
    if ((e.target.id === "d-location" || e.target.tagName === "INPUT") && e.target.id !== "d-interviewing") {
      save(job, true);
    }
  });

  // ---------- Contacts ----------
  function renderContacts(job) {
    var list = document.getElementById("contacts-list");
    if (!job.contacts.length) {
      list.innerHTML = '<p style="color:var(--ink-faint); font-size:0.82rem; margin:0;">No contacts yet.</p>';
    } else {
      list.innerHTML = job.contacts.map(function (c) {
        return '<div class="card" data-cid="' + c.id + '">' +
          '<button class="icon-btn rm" data-action="rm-contact" data-cid="' + c.id + '" aria-label="Remove contact">✕</button>' +
          '<div class="card-grid">' +
          field2("Name", "text", c.name, c.id, "name") +
          field2("Phone", "tel", c.phone, c.id, "phone") +
          field2("Email", "email", c.email, c.id, "email") +
          field2("LinkedIn", "text", c.linkedin, c.id, "linkedin") +
          "</div></div>";
      }).join("");
    }
  }

  function field2(label, type, val, cid, field) {
    var esc = String(val || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    return '<div class="field"><label>' + label + '</label><input type="' + type + '" value="' + esc +
      '" data-cid="' + cid + '" data-cfield="' + field + '"></div>';
  }

  document.getElementById("add-contact").addEventListener("click", function () {
    var job = findJob(state.activeId);
    if (!job) return;
    job.contacts.push({ id: uid(), name: "", phone: "", email: "", linkedin: "" });
    save(job, true);
    renderContacts(job);
  });

  document.getElementById("contacts-list").addEventListener("input", function (e) {
    var el = e.target;
    var cid = el.getAttribute("data-cid"), field = el.getAttribute("data-cfield");
    if (!cid || !field) return;
    var job = findJob(state.activeId);
    if (!job) return;
    var c = job.contacts.find(function (x) { return x.id === cid; });
    if (c) { c[field] = el.value; save(job); }
  });

  document.getElementById("contacts-list").addEventListener("click", function (e) {
    var btn = e.target.closest('button[data-action="rm-contact"]');
    if (!btn) return;
    if (!confirm("Remove this contact? This can't be undone.")) return;
    var job = findJob(state.activeId);
    if (!job) return;
    job.contacts = job.contacts.filter(function (c) { return c.id !== btn.getAttribute("data-cid"); });
    save(job, true);
    renderContacts(job);
  });

  // ---------- Interviews & follow-ups (shared logic) ----------
  function renderEntries(job, key, listId) {
    var list = document.getElementById(listId);
    var entries = job[key];
    if (!entries.length) {
      list.innerHTML = '<p style="color:var(--ink-faint); font-size:0.82rem; margin:0;">None logged yet.</p>';
      return;
    }
    list.innerHTML = entries.map(function (e, idx) {
      var notesEsc = String(e.notes || "").replace(/</g, "&lt;");
      return '<div class="card entry-card" data-eid="' + e.id + '">' +
        '<button class="icon-btn rm" data-action="rm-entry" data-key="' + key + '" data-eid="' + e.id + '" aria-label="Remove entry">✕</button>' +
        '<div class="entry-head"><label style="font-size:0.72rem; color:var(--ink-faint); font-weight:500;">' +
        (key === "interviews" ? "Interview " : "Follow-up ") + (idx + 1) + "</label>" +
        '<input type="date" value="' + (e.date || "") + '" data-key="' + key + '" data-eid="' + e.id + '" data-efield="date"></div>' +
        '<textarea placeholder="Notes" data-key="' + key + '" data-eid="' + e.id + '" data-efield="notes">' + notesEsc + "</textarea>" +
        "</div>";
    }).join("");
  }

  function bindEntrySection(key, listId, addBtnId) {
    document.getElementById(addBtnId).addEventListener("click", function () {
      var job = findJob(state.activeId);
      if (!job) return;
      job[key].push({ id: uid(), date: "", notes: "" });
      save(job, true);
      renderEntries(job, key, listId);
    });
    var list = document.getElementById(listId);
    list.addEventListener("input", function (e) {
      var el = e.target;
      var eid = el.getAttribute("data-eid"), field = el.getAttribute("data-efield");
      if (!eid || !field) return;
      var job = findJob(state.activeId);
      if (!job) return;
      var entry = job[key].find(function (x) { return x.id === eid; });
      if (entry) { entry[field] = el.value; save(job); }
    });
    list.addEventListener("click", function (e) {
      var btn = e.target.closest('button[data-action="rm-entry"]');
      if (!btn) return;
      var noun = key === "interviews" ? "interview" : "follow-up";
      if (!confirm("Remove this " + noun + "? This can't be undone.")) return;
      var job = findJob(state.activeId);
      if (!job) return;
      job[key] = job[key].filter(function (x) { return x.id !== btn.getAttribute("data-eid"); });
      save(job, true);
      renderEntries(job, key, listId);
    });
  }

  bindEntrySection("interviews", "interviews-list", "add-interview");
  bindEntrySection("followups", "followups-list", "add-followup");

  // Keep multiple tabs of this tracker (same browser, no cloud sync) from drifting apart.
  window.addEventListener("storage", function (e) {
    if (e.key !== STORAGE_KEY || state.activeId) return;
    state.jobs = load();
    renderTable();
  });

  renderTable();
  initExport();
  initCloudSync().then(handleBookmarkletAdd);
})();
</script>

</body></html>
